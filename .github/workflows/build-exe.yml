# =============================================================================
# Build EXE — Cross-platform executables (on release)
# =============================================================================
# Builds standalone executables for Mac (ARM), Windows, and Linux
# using `bun build --compile`.
#
# ⚠️  LIMITACIÓN: El EXE no puede procesar PDFs (usa @napi-rs/canvas, módulo
#     nativo que no se puede embeber). Sí funciona: HTML, Excel, cálculos,
#     listado de docentes. Para PDFs usá Docker.
# =============================================================================

name: Build EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (ej: v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: legajo-digital-linux-x64
            ext: ""
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: legajo-digital-macos-arm64
            ext: ""
          - os: windows-latest
            target: bun-windows-x64
            artifact: legajo-digital-windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        shell: bash
        run: |
          bun build --compile \
            --target ${{ matrix.target }} \
            --sourcemap \
            --outfile ${{ matrix.artifact }}${{ matrix.ext }} \
            server.js

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}
          compression-level: 0

      - name: Upload to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact }}${{ matrix.ext }}
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
