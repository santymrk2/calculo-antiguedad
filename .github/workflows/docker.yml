# =============================================================================
# Docker — Build and test on every push
# =============================================================================
# Builds the Docker image and runs a smoke test to verify:
#   - Image builds successfully
#   - Container starts
#   - Health check passes
#   - API endpoints respond correctly
# =============================================================================

name: Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: legajo-digital

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name legajo-digital \
            -p 3000:3000 \
            -v ${{ github.workspace }}/datos_locales:/app/datos_locales \
            ${{ env.IMAGE_NAME }}:test

      - name: Wait for health check
        run: |
          echo "Esperando que el servidor responda..."
          for i in $(seq 1 15); do
            if curl -s http://localhost:3000/ > /dev/null 2>&1; then
              echo "✅ Servidor listo!"
              break
            fi
            echo "  Intento $i/15..."
            sleep 2
          done

      - name: Smoke test — HTML page
        run: |
          echo "=== GET / ==="
          HTTP_CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" http://localhost:3000/)
          echo "Status: $HTTP_CODE"
          test "$HTTP_CODE" -eq 200 || exit 1
          grep -q "Legajo Digital" /tmp/index.html || exit 1
          echo "✅ HTML OK"

      - name: Smoke test — GET /agentes
        run: |
          echo "=== GET /agentes ==="
          AGENTES=$(curl -s http://localhost:3000/agentes)
          echo "$AGENTES" | jq -e '.agentes | type == "array"' > /dev/null
          COUNT=$(echo "$AGENTES" | jq '.agentes | length')
          echo "Docentes encontrados: ${COUNT} (container fresco, 0 es OK)"
          echo "OK /agentes (JSON valido)"

      - name: Stop container
        run: docker stop legajo-digital

      - name: Upload logs on failure
        if: failure()
        run: docker logs legajo-digital 2>&1 || true

  # Optional: Push to GitHub Container Registry (only on main branch)
  push-to-ghcr:
    name: Push to GHCR
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
