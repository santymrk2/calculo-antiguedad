services:
  legajo-digital:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legajo-digital
    ports:
      - "3000:3000"
    volumes:
      - ./datos_locales:/app/datos_locales
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped
    labels:
      description: "Cálculo de Antigüedad Docente — PBA + Vite+"
      version: "2.0.0"